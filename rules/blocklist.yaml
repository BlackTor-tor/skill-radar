# rules/blocklist.yaml — 供应链 IOC 黑名单（check_blocklist 数据源）
#
# 格式：顶层为一个条目列表（块列表 `- ` 开头），每个条目可含以下三个匹配字段，
# 任一字段与被扫技能相符即各产出一条 CRITICAL finding（rule_id=SR-BLOCK-001, category=SUPPLY）：
#   name: 技能名（与 SKILL.md name 精确匹配）
#   repo: 仓库标识（精确匹配，形如 owner/repo）
#   hash: 文件 SHA-256（对文件原始字节计算，含被跳过的二进制/超限文件；
#         单文件 8MB 哈希上限；与扫描中任一文件哈希相符即命中，finding 定位到对应文件）
#
# 来源标注要求：每个条目必须带 source 字段，注明情报出处（如
#   "ClawHavoc IOC list 2026-06, antiy.net"）；该来源会出现在命中 finding 的
#   message 中，供人工复核追溯。
#
# 填充指引（实现者执行）：从以下公开报告提取技能名/仓库/哈希，逐条附 source：
#   - ClawHavoc: https://www.antiy.net/p/clawhavoc-analysis-of-large-scale-poisoning-campaign-targeting-the-openclaw-skill-market-for-ai-agents
#   - Penligent IOC 清单: https://www.penligent.ai/hackinglabs/clawhub-malicious-skills-beyond-prompt-injection
#   - skills.sh 事件: https://daily.dev/posts/malicious-ai-skills-on-skills-sh-stole-credentials-at-scale-racking-up-1-7m-installs-kaamk0eda
# 提取到的每条 IOC 在 tests/test_blocklist.py 加一个对应 hash/name 命中用例（回归集）。
#
# 已录入（2026-10-02 提取，来源 ClawHavoc · antiy.net 报告）：仅录报告样本表直接
# 绑定的 SKILL Package Name。报告样本哈希为 MD5 口径，与引擎 hash 字段的 SHA-256
# 口径不合，不录入；报告另列的类目代表名（typosquat 等）、作者账号与 C2 基础设施
# 归属置信度/匹配字段不足，宁缺毋滥暂不录。Penligent 页仅见空串 SHA-256 生成残留、
# skills.sh 事件报道无结构化 IOC，均无条目可录。
