# macOS 构建与测试（GitHub 托管 runner = Apple 硬件，公共仓库免费分钟数）
# 产出 dist/SkillRadarTray.app 与 dist/SkillRadarTray.dmg（artifact 下载）；
# 并跑全量测试套件（Windows 专属用例自动 skip）。
# 真机 GUI 验收（托盘/四屏交互）无法在 runner 上进行，需维护者本地执行。
name: macos-tray

on:
  push:
    branches: [main]
    paths: ['tray/**', 'skill_guard.py', 'skill_add.py', 'skill_report.py', 'skill_monitor.py', 'skill_inventory.py', 'tests/**', 'rules/**', 'requirements-gui.txt', 'build_tray.py', '.github/workflows/macos-tray.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium for browser checks
        id: chrome
        uses: browser-actions/setup-chrome@v1
      - name: Configure browser path
        shell: bash
        run: |
          browser='${{ steps.chrome.outputs.chrome-path }}'
          test -x "$browser"
          echo "SKILL_RADAR_BROWSER=$browser" >> "$GITHUB_ENV"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-gui.txt
          pip install pytest

      - name: Run test suite
        run: python -m pytest tests -q

      - name: Build .app + dmg
        run: python build_tray.py

      - name: Archive app with executable permissions
        run: ditto -c -k --sequesterRsrc --keepParent dist/SkillRadarTray.app dist/SkillRadarTray-macos.zip

      - name: Validate app, archive, architecture, and mounted DMG
        run: python tests/tray/package_smoke.py --app dist/SkillRadarTray.app --archive dist/SkillRadarTray-macos.zip --dmg dist/SkillRadarTray.dmg --expected-arch "$(uname -m)"

      - uses: actions/upload-artifact@v4
        with:
          name: SkillRadarTray-macos
          path: |
            dist/SkillRadarTray-macos.zip
            dist/SkillRadarTray.dmg
          retention-days: 14
