# 版本发布：标签、手动运行，或 main 分支 macOS CI 成功后自动发布。
# 自动发布固定使用触发 CI 的 commit；CI 失败、过期或非本仓库运行不会发布。
name: release

concurrency:
  group: skill-radar-release-main
  cancel-in-progress: false

on:
  push:
    tags: ['v*']
  workflow_run:
    workflows: ['macos-tray']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（v2.2.0 或 2.2.0；留空=只构建不发布）'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.plan.outputs.should_build }}
      should_publish: ${{ steps.plan.outputs.should_publish }}
      target_sha: ${{ steps.plan.outputs.target_sha }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Plan release
        id: plan
        uses: actions/github-script@v7
        with:
          script: |
            const event = context.eventName;
            const repo = context.repo;
            const run = context.payload.workflow_run;
            const input = context.payload.inputs?.version || '';
            const {normalizeVersion, nextPatch, checkoutSha, autoDecision} =
              require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/release-plan.cjs`);

            let shouldBuild = true;
            let shouldPublish = true;
            let targetSha = checkoutSha({
              eventName: event, githubSha: context.sha, workflowRun: run,
            });
            let version = '';
            if (event === 'workflow_run') {
              const tags = await github.paginate(github.rest.repos.listTags, {
                owner: repo.owner, repo: repo.repo, per_page: 100,
              });
              version = nextPatch(tags.map((tag) => tag.name));
              const releases = await github.paginate(github.rest.repos.listReleases, {
                owner: repo.owner, repo: repo.repo, per_page: 100,
              });
              const main = await github.rest.repos.getBranch({
                owner: repo.owner, repo: repo.repo, branch: 'main',
              });
              shouldPublish = autoDecision({
                event: run?.event,
                conclusion: run?.conclusion,
                headBranch: run?.head_branch,
                headRepository: run?.head_repository?.full_name,
                repository: `${repo.owner}/${repo.repo}`,
                expectedRepository: `${repo.owner}/${repo.repo}`,
                targetSha,
                mainSha: main.data.commit.sha,
                releaseShas: releases.map((release) => release.target_commitish),
              }).publish;
              if (releases.some((release) => release.tag_name === version)) {
                shouldPublish = false;
              }
              shouldBuild = shouldPublish;
            } else if (event === 'push') {
              version = normalize(context.ref.replace('refs/tags/', ''));
            } else if (event === 'workflow_dispatch') {
              shouldPublish = Boolean(input.trim());
              if (shouldPublish) version = normalize(input);
            } else {
              shouldBuild = false;
              shouldPublish = false;
            }

            if (shouldPublish && event !== 'workflow_run') {
              const releases = await github.paginate(github.rest.repos.listReleases, {
                owner: repo.owner, repo: repo.repo, per_page: 100,
              });
              const duplicate = releases.some((release) =>
                release.tag_name === version || release.target_commitish === targetSha);
              if (duplicate) {
                shouldPublish = false;
                shouldBuild = false;
              }
            }
            core.setOutput('should_build', String(shouldBuild));
            core.setOutput('should_publish', String(shouldPublish));
            core.setOutput('target_sha', targetSha);
            core.setOutput('version', version);
            core.info(JSON.stringify({event, shouldBuild, shouldPublish, targetSha, version}));

  windows:
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.target_sha }}
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements-gui.txt
          pip install pytest
      - run: python -m pytest tests -q
      - run: python build_tray.py
      - uses: actions/upload-artifact@v4
        with:
          name: SkillRadarTray-windows
          path: dist/SkillRadarTray.exe
          retention-days: 14

  macos:
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: arm64, py_arch: arm64 }
          - { arch: x64, py_arch: x64 }
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.target_sha }}
      - name: Install Rosetta 2 (x64 cross-build)
        if: matrix.py_arch == 'x64'
        run: softwareupdate --install-rosetta --agree-to-license
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: ${{ matrix.py_arch }}
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Install Chromium for browser checks
        id: chrome
        uses: browser-actions/setup-chrome@v1
      - name: Configure browser path
        shell: bash
        run: |
          browser='${{ steps.chrome.outputs.chrome-path }}'
          test -x "$browser"
          echo "SKILL_RADAR_BROWSER=$browser" >> "$GITHUB_ENV"
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements-gui.txt
          pip install pytest
      - run: python -m pytest tests -q
      - run: python build_tray.py
      - name: Archive app with executable permissions
        run: ditto -c -k --sequesterRsrc --keepParent dist/SkillRadarTray.app dist/SkillRadarTray-macos.zip
      - name: Validate app, archive, architecture, and mounted DMG
        run: python tests/tray/package_smoke.py --app dist/SkillRadarTray.app --archive dist/SkillRadarTray-macos.zip --dmg dist/SkillRadarTray.dmg --expected-arch "${{ matrix.arch }}"
      - uses: actions/upload-artifact@v4
        with:
          name: SkillRadarTray-macos-${{ matrix.arch }}
          path: |
            dist/SkillRadarTray-macos.zip
            dist/SkillRadarTray.dmg
          retention-days: 14

  publish:
    needs: [prepare, windows, macos]
    if: >-
      always() && needs.prepare.outputs.should_publish == 'true' &&
      needs.windows.result == 'success' && needs.macos.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - name: Prepare release files
        run: |
          mkdir -p release
          cp artifacts/SkillRadarTray-windows/SkillRadarTray.exe release/SkillRadarTray_windows_x64.exe
          cp artifacts/SkillRadarTray-macos-arm64/SkillRadarTray.dmg release/SkillRadarTray_macos_arm64.dmg
          cp artifacts/SkillRadarTray-macos-x64/SkillRadarTray.dmg release/SkillRadarTray_macos_x64.dmg
          ls -la release
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.version }}
          target_commitish: ${{ needs.prepare.outputs.target_sha }}
          name: skill-radar ${{ needs.prepare.outputs.version }}
          files: |
            release/SkillRadarTray_windows_x64.exe
            release/SkillRadarTray_macos_arm64.dmg
            release/SkillRadarTray_macos_x64.dmg
          body: |
            skill-radar ${{ needs.prepare.outputs.version }}

            - **SkillRadarTray_windows_x64.exe** — Windows 托盘守护（x64/AMD64）
            - **SkillRadarTray_macos_arm64.dmg** — macOS Apple Silicon
            - **SkillRadarTray_macos_x64.dmg** — macOS Intel

            此版本由 main 分支 CI 通过后自动构建发布。
