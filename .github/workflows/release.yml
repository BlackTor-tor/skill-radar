# 版本发布（两条路径，产物都进 GitHub Releases）：
# 1) push tag（如 v2.2.0）→ 双平台构建 → 发布；
# 2) 手动 Run workflow 填 version（如 v2.2.0 / 2.2.0 均可）→ 流水线在当前 main
#    HEAD 上自动建 tag → 构建 → 发布（tag 由 publish 步骤创建，无需本地打 tag）。
# 手动触发且 version 留空 = 只构建、不发布。
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（v2.2.0 或 2.2.0；留空=只构建不发布）'
        required: false
        default: ''

permissions:
  contents: write   # 建 tag 与创建 Release 所需（显式声明，最小权限）

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements-gui.txt
          pip install pytest
      - run: python -m pytest tests -q
      - run: python build_tray.py
      - uses: actions/upload-artifact@v4
        with:
          name: SkillRadarTray-windows
          path: dist/SkillRadarTray.exe
          retention-days: 14

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements-gui.txt
          pip install pytest
      - run: python -m pytest tests -q
      - run: python build_tray.py
      - uses: actions/upload-artifact@v4
        with:
          name: SkillRadarTray-macos
          path: |
            dist/SkillRadarTray.app
            dist/SkillRadarTray.dmg
          retention-days: 14

  publish:
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.version != '')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - name: Resolve version
        id: ver
        run: |
          V="${{ github.event_name == 'push' && github.ref_name || inputs.version }}"
          case "$V" in v*) ;; *) V="v$V";; esac   # 归一为 v 前缀
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - name: Prepare release files
        run: |
          mkdir -p release
          cp artifacts/SkillRadarTray-windows/SkillRadarTray.exe release/SkillRadarTray_windows_x64.exe
          cp artifacts/SkillRadarTray-macos/SkillRadarTray.dmg release/SkillRadarTray_macos_arm64.dmg
          ls -la "${{ github.workspace }}/release"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.version }}   # tag 不存在时自动在当前 SHA 上创建
          target_commitish: ${{ github.sha }}
          name: skill-radar ${{ steps.ver.outputs.version }}
          files: |
            release/SkillRadarTray_windows_x64.exe
            release/SkillRadarTray_macos_arm64.dmg
          body: |
            skill-radar ${{ steps.ver.outputs.version }}

            - **SkillRadarTray_windows_x64.exe** — Windows 托盘守护（onefile，双击即用；x64/AMD64）
            - **SkillRadarTray_macos_arm64.dmg** — macOS 托盘守护（Apple Silicon M 系列；打开后把 .app 拖入
              Applications。Intel Mac 不适用——需要 Intel 版请在 Actions 手动跑 release 工作流的时代
              用 macos-13 Intel runner 另行构建，当前未产出）
              （未签名/未公证：下载后首次启动会被 Gatekeeper 拦截——macOS 13/14 右键 → 打开；
              macOS 15+ 到 系统设置 → 隐私与安全性 → 「仍要打开」，详见 README）
            - CLI（scan / audit / add 网关 / report）不在包内：以源码运行（零依赖），见 README 快速开始

            变更日志见本 tag 与上一 tag 的对比。
